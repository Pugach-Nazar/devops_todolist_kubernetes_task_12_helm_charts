# Source: todoapp/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp-todoapp
  labels:
    helm.sh/chart: todoapp-0.1.0
    app.kubernetes.io/name: todoapp
    app.kubernetes.io/instance: todoapp
    app.kubernetes.io/version: "4.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: todoapp
      app.kubernetes.io/instance: todoapp
  template:
    metadata:
      labels:
        helm.sh/chart: todoapp-0.1.0
        app.kubernetes.io/name: todoapp
        app.kubernetes.io/instance: todoapp
        app.kubernetes.io/version: "4.0.1"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: secrets-reader
      containers:
        - name: todoapp
          image: "ikulyk404/todoapp:4.0.1"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 150m
              memory: 256Mi
            requests:
              cpu: 150m
              memory: 256Mi
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: todoapp-todoapp-app-secret
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: todoapp-todoapp-app-secret
                  key: DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todoapp-todoapp-app-secret
                  key: DB_PASSWORD
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: todoapp-todoapp-app-secret
                  key: DB_USER
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: todoapp-todoapp-app-secret
                  key: SECRET_KEY
          volumeMounts:
            - mountPath: /app/data
              name: data
            - mountPath: /app/secrets
              name: app-secrets-volume
              readOnly: true
            - mountPath: /app/configs
              name: app-config-volume
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: todoapp-todoapp-pvc-data
        - name: app-secrets-volume
          secret:
            secretName: todoapp-todoapp-app-secret
        - name: app-config-volume
          configMap:
            name: todoapp-todoapp-app-config
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - todoapp


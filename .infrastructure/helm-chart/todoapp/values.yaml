namespace: todoapp

replicaCount: 2

image:
  repository: ikulyk404/todoapp
  tag: 4.0.1
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

serviceAccount:
  create: true
  name: secrets-reader
  automount: true
  annotations: {}

rbac:
  enabled: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 1

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 150m
    memory: 256Mi

nodeAffinity:
  key: app
  values:
    - todoapp

tolerations: []

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

secret:
  name: app-secret
  data:
    SECRET_KEY: QGUyKHl4KXYmdGdoM19zPTB5amEtaSFkcGVieHN6XmRnNDd4KS1rJmtxXzN6Zio5ZSoK
    DB_NAME: YXBwX2RiCg==
    DB_USER: YXBwX3VzZXI=
    DB_PASSWORD: MTIzNA==
    DB_HOST: bXlzcWwtdG9kb2FwcC5teXNxbC5zdmMuY2x1c3Rlci5sb2NhbA==

config:
  name: app-config
  data:
    PYTHONUNBUFFERED: "1"

persistentVolume:
  enabled: true
  name: pv-data
  storageClassName: standard
  capacity: 1Gi
  accessModes:
    - ReadWriteMany
  hostPath: /data/

persistentVolumeClaim:
  name: pvc-data
  storage: 1Gi
  accessModes:
    - ReadWriteMany

volumeMounts:
  - name: data
    mountPath: /app/data
  - name: app-secrets-volume
    mountPath: /app/secrets
    readOnly: true
  - name: app-config-volume
    mountPath: /app/configs
    readOnly: true

livenessProbe:
  httpGet:
    path: /api/health
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 5

readinessProbe:
  httpGet:
    path: /api/ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: localhost
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false

mysql:
  namespace: mysql
  replicaCount: 2
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  secret:
    name: mysql-secrets
    data:
      MYSQL_ROOT_PASSWORD: MTIzNA==
      MYSQL_USER: YXBwX3VzZXI=
      MYSQL_PASSWORD: MTIzNA==
  database: app_db
  service:
    port: 3306
  persistentVolumeClaim:
    storage: 2Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
  nodeAffinity:
    key: app
    values:
      - mysql
  tolerations:
    - key: app
      operator: Equal
      value: mysql
      effect: NoSchedule
